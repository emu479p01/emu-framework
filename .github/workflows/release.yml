name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate version policy and release notes
        id: release_policy
        shell: bash
        run: |
          node scripts/release-policy.mjs \
            --tag "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - uses: docker/setup-buildx-action@v4
      - name: Build both container images before publishing
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker buildx build --load --tag "ghcr.io/emu479p01/emu-framework:$VERSION" .
          docker buildx build --load --file Dockerfile.updater --tag "ghcr.io/emu479p01/emu-framework-updater:$VERSION" .
          node scripts/verify-container-images.mjs "ghcr.io/emu479p01/emu-framework:$VERSION" "ghcr.io/emu479p01/emu-framework-updater:$VERSION"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated images
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker push "ghcr.io/emu479p01/emu-framework:$VERSION"
          docker push "ghcr.io/emu479p01/emu-framework-updater:$VERSION"
          docker tag "ghcr.io/emu479p01/emu-framework:$VERSION" ghcr.io/emu479p01/emu-framework:latest
          docker tag "ghcr.io/emu479p01/emu-framework-updater:$VERSION" ghcr.io/emu479p01/emu-framework-updater:latest
          docker push ghcr.io/emu479p01/emu-framework:latest
          docker push ghcr.io/emu479p01/emu-framework-updater:latest
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release_policy.outputs.release_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
