name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate version policy and release notes
        id: release_policy
        shell: bash
        run: |
          node scripts/release-policy.mjs \
            --tag "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable container images
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker buildx build --push \
            --tag "ghcr.io/emu479p01/emu-framework:$VERSION" \
            --tag "ghcr.io/emu479p01/emu-framework:latest" .
          docker buildx build --push --file Dockerfile.updater \
            --tag "ghcr.io/emu479p01/emu-framework-updater:$VERSION" \
            --tag "ghcr.io/emu479p01/emu-framework-updater:latest" .
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_policy.outputs.release_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
