name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24.22.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: docker/setup-buildx-action@v4
      - name: Build both container images
        run: |
          docker buildx build --load --tag emu-app:ci .
          docker buildx build --load --file Dockerfile.updater --tag emu-updater:ci .
      - name: Check container runtime and health before and after restart
        run: node scripts/verify-container-images.mjs emu-app:ci emu-updater:ci
